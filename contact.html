<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти | Денонощен Ключар София 24/7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { emergency: { dark: '#09090b', amber: '#f59e0b' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-emergency-dark text-slate-100 font-sans pb-24 lg:pb-0">

    <header class="sticky top-0 z-40 bg-zinc-950/95 border-b border-zinc-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-11 h-11 bg-amber-500 rounded-xl flex items-center justify-center text-zinc-950 font-black text-xl">
                    <i class="fa-solid fa-key"></i>
                </div>
                <span class="text-lg font-black text-white uppercase">КЛЮЧАР <span class="text-amber-500">СОФИЯ</span></span>
            </a>
            <nav class="hidden lg:flex space-x-6 text-sm font-semibold text-zinc-300">
                <a href="index.html" class="hover:text-amber-400">Начало</a>
                <a href="services.html" class="hover:text-amber-400">Услуги</a>
                <a href="prices.html" class="hover:text-amber-400">Цени</a>
                <a href="coverage.html" class="hover:text-amber-400">Райони</a>
                <a href="contact.html" class="text-amber-400 font-bold">Контакт</a>
            </nav>
            <button id="mobile-menu-btn" class="lg:hidden text-zinc-300 hover:text-white text-2xl p-2 focus:outline-none" aria-label="Меню">
                <i class="fa-solid fa-bars" id="menu-icon"></i>
            </button>
        </div>
        <div id="mobile-menu" class="hidden lg:hidden bg-zinc-900 border-b border-zinc-800 px-4 pt-3 pb-6 space-y-3 text-center font-medium shadow-2xl">
            <a href="index.html" class="block py-2 text-zinc-300 hover:text-amber-400 border-b border-zinc-800/50">Начало</a>
            <a href="services.html" class="block py-2 text-zinc-300 hover:text-amber-400 border-b border-zinc-800/50">Услуги</a>
            <a href="prices.html" class="block py-2 text-zinc-300 hover:text-amber-400 border-b border-zinc-800/50">Цени в €</a>
            <a href="coverage.html" class="block py-2 text-zinc-300 hover:text-amber-400 border-b border-zinc-800/50">Райони</a>
            <a href="contact.html" class="block py-2 text-amber-400 font-bold">Контакт</a>
        </div>
    </header>

    <section class="py-16 max-w-7xl mx-auto px-4">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <div>
                <span class="text-amber-500 font-bold text-sm uppercase mb-2 block">24/7 Дежурен Екип</span>
                <h1 class="text-4xl font-black text-white mb-6">Свържете се с нас</h1>
                <p class="text-zinc-400 mb-8">При спешност ни потърсете директно на дежурния телефон.</p>

                <div class="space-y-4">
                    <a href="tel:+359888123456" class="flex items-center space-x-4 p-5 bg-zinc-900 border border-amber-500/40 rounded-2xl">
                        <div class="w-12 h-12 bg-amber-500 text-zinc-950 rounded-xl flex items-center justify-center text-xl font-bold">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <div>
                            <span class="text-xs text-zinc-400 block">Дежурен телефон:</span>
                            <span class="text-xl font-bold text-amber-400">088 812 3456</span>
                        </div>
                    </a>

                    <a href="https://maps.google.com/?q=София+бул.+Витоша+120" target="_blank" class="flex items-center space-x-4 p-5 bg-zinc-900 border border-zinc-800 rounded-2xl">
                        <div class="w-12 h-12 bg-zinc-800 text-amber-400 rounded-xl flex items-center justify-center text-xl font-bold">
                            <i class="fa-solid fa-map-location-dot"></i>
                        </div>
                        <div>
                            <span class="text-xs text-zinc-400 block">Адрес:</span>
                            <span class="text-base font-bold text-white">гр. София, бул. „Витоша“ 120</span>
                        </div>
                    </a>
                </div>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl">
                <h3 class="text-xl font-bold text-white mb-4">Изпратете съобщение</h3>
                <form class="space-y-4">
                    <input type="text" placeholder="Вашето име" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
                    <input type="tel" placeholder="Телефон" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500">
                    <textarea placeholder="Съобщение..." rows="4" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500"></textarea>
                    <button type="submit" class="w-full py-3.5 bg-amber-500 text-zinc-950 font-bold rounded-xl hover:bg-amber-400 transition">Изпрати</button>
                </form>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });
    </script>
</body>
</html>
